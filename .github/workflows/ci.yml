name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-groups
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy app scripts
      - name: Tests
        run: uv run pytest --cov=app --cov-report=term
      - name: Migration smoke
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
        run: |
          mkdir -p data
          uv run alembic upgrade head
      - name: Deploy archive
        run: |
          uv run python scripts/build_deploy_zip.py
          uv run python scripts/inspect_deploy_zip.py
      - name: Docker build
        run: docker build -t kino-ticket-bot .

