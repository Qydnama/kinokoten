[project]
name = "kino-ticket-bot"
version = "0.1.0"
description = "Telegram bot that watches Kino.kz for newly available movie tickets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3,<4",
  "aiosqlite>=0.20,<1",
  "alembic>=1,<2",
  "httpx>=0.27,<1",
  "pydantic-settings>=2,<3",
  "rapidfuzz>=3,<4",
  "sqlalchemy>=2,<3",
  "tenacity>=8,<10",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "respx>=0.22",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the live Kino.kz API"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic/"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
